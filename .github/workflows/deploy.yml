name: Convert Jupyter Notebooks to HTML & Deploy to GitHub Pages

on:
  push:
    branches:
      - gh-pages
    paths:
      - 'notebooks/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:  

jobs:
  convert-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Jupyter
        run: pip install jupyter

      - name: Convert Jupyter Notebooks to HTML
        run: |
          mkdir -p docs
          jupyter nbconvert --to html notebooks/*.ipynb --output-dir=docs
          find notebooks -name "*.html" -delete  # Delete extra HTML files in notebooks/

      - name: Generate Index Page
        run: |
          echo "<html><body><h1>Jupyter Notebooks</h1><ul>" > docs/index.html
          for file in docs/*.html; do
            filename=$(basename "$file")
            if [ "$filename" != "index.html" ]; then
              echo "<li><a href='$filename'>$filename</a></li>" >> docs/index.html
            fi
          done
          echo "</ul></body></html>" >> docs/index.html

      - name: Add Back Button to HTML Pages
        run: |
          for file in docs/*.html; do
            filename=$(basename "$file")
            if [ "$filename" != "index.html" ]; then
              sed -i '1i <button onclick="location.href=\'index.html\'">Back to Index</button><br><br>' "$file"
            fi
          done

      - name: Commit converted HTML files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git commit -m "Auto-converted Jupyter Notebooks to HTML" || echo "No changes to commit"
          git push origin gh-pages

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: docs
          target-folder: docs
          clean: false
