<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chromatic Colorer</title>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.23.4/full/pyodide.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/web-animations-js@2.3.2/web-animations.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }
        h2 {
            color: #333;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        canvas {
            background-color: white;
            border: 2px solid black;
            cursor: pointer;
            touch-action: none;
        }
        .button-container {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        button {
            padding: 10px 15px;
            border: none;
            cursor: pointer;
            font-size: 14px;
            border-radius: 5px;
            background-color: #007BFF;
            color: white;
        }
        button:hover {
            background-color: #0056b3;
        }
        button:disabled {
            cursor: not-allowed;
        }
        pre {
            background-color: #fff;
            padding: 10px;
            border-radius: 5px;
            text-align: left;
            width: 80%;
            max-width: 600px;
        }
    </style>
</head>
<body>

<h2>Chromatic Colorer</h2>

<div class="container">
    <canvas id="graphCanvas" width="800" height="500"></canvas>
    <div class="button-container">
        <button onclick="runPython('clear_graph')">Clear Graph</button>
        <button id="explainTightBoundBtn" onclick="explainTightBound()">Explain Tight Bound</button>
        <button onclick="recolorWithStrategy('random_sequential')">Recolor Vertices</button>
        <button onclick="deleteVertex()">Delete Vertex</button>
        <button onclick="undoAction()">Undo</button>
        <button onclick="redoAction()">Redo</button>
        <button onclick="explainBrooksTheorem()">Explain Brook's Theorem</button>
    </div>
    <pre id="output"></pre>
    <div id="animationContainer" style="margin-top:20px;"></div>

    <div id="loadingOverlay" style="
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background-color: rgba(255, 255, 255, 0.85);
    z-index: 1000;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 24px;
    color: #333;
    font-weight: bold;
    font-family: Arial, sans-serif;
    ">
        Loading... Please wait
    </div>
    <div id="brooksModal" style="
    display: none;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: white;
    padding: 20px;
    border: 2px solid black;
    border-radius: 8px;
    z-index: 2000;
    box-shadow: 0 0 20px rgba(0,0,0,0.5);
    min-width: 30%;
    max-width: 30%;
    max-height: 90%;
    overflow: auto;
">
        <h3 id="brooksModalHeader">Brook's Theorem (Page 1/3)</h3>
        <p id="brooksModalContent" style="text-align: left; white-space: pre-wrap; overflow-wrap: break-word;"></p>
        <div style="display: flex; justify-content: center; gap: 20px; margin-top: 20px;">
            <button onclick="prevPage()">←</button>
            <button onclick="nextPage()">→</button>
        </div>
        <br>
        <button onclick="closeBrooksModal()">Close</button>
    </div>
    <div id="modalOverlay" style="
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background-color: rgba(0, 0, 0, 0.5);
    z-index: 1500;
"></div>
</div>

<script>
    let pyodideReady = false;
    let vertices = [];
    let edges = [];
    let selectedVertex = null;
    let draggingVertex = null;
    let startX = 0, startY = 0, hasMoved = false;
    let isomorphismMapping = null;
    let hoveredVertex = null;
    let canvas = document.getElementById("graphCanvas");
    let undoStack = [];
    let redoStack = [];
    const MAX_UNDO = 100;
    let vertexColors = {};
    let previousColors = {};
    const colorPalette = [
        "#FF595E", "#FFCA3A", "#8AC926", "#1982C4", "#6A4C93",
        "#FF9F1C", "#D7263D", "#3F88C5", "#F49D37", "#A1C181"
    ];

    loadPyodideAndPackages();

    async function loadPyodideAndPackages() {
        window.pyodide = await loadPyodide();
        await pyodide.loadPackage(["networkx"]);
        await pyodide.runPythonAsync(`
import networkx as nx
import json

vertices = []
edges = []
GM = None
coloring = {}

def clear_graph():
    global vertices, edges
    vertices = []
    edges = []
    print("Graph cleared.")

def sync_graph_to_python(js_vertices, js_edges):
    global vertices, edges
    vertices = js_vertices
    edges = js_edges

def compute_coloring_info(strategy="largest_first"):
    global coloring
    G = nx.Graph()

    for i, (x, y) in enumerate(vertices):
        G.add_node(i)

    for i, j in edges:
        G.add_edge(i, j)

    if len(G.nodes) == 0:
        coloring = {}
        return json.dumps({
            "message": "Graph is empty.",
            "coloring": {},
            "chromatic_number": 0,
            "max_degree": 0,
            "inequality_holds": True,
            "vertices": [],
            "edges": []
        })


    coloring = nx.coloring.greedy_color(G, strategy=strategy)
    chromatic_number = max(coloring.values()) + 1 if coloring else 0
    max_degree = max(dict(G.degree()).values()) if G.nodes else 0
    is_connected = nx.is_connected(G)
    tight = is_connected and (len(vertices) >= 2) and (chromatic_number == max_degree + 1)
    vertex_list = list(G.nodes)
    edge_list = list(G.edges)

    return json.dumps({
        "message": (
        f"χ(G) ≤ {chromatic_number}, Δ(G) = {max_degree}, χ(G) ≤ Δ(G)+1: {chromatic_number <= max_degree + 1}\\n"
        f"Vertices: {vertex_list}\\n"
        f"Edges: {edge_list}"
        ),
        "coloring": coloring,
        "chromatic_number": chromatic_number,
        "max_degree": max_degree,
        "inequality_holds": chromatic_number <= max_degree + 1,
        "tight": tight,
        "vertices": list(G.nodes),
        "edges": list(G.edges)
    })

def get_edge_list():
    return json.dumps({"edges": edges})

def exact_chromatic_number(G):
    import itertools

    n = len(G.nodes)
    for k in range(1, n + 1):
        for coloring in itertools.product(range(k), repeat=n):
            color_map = dict(zip(G.nodes, coloring))
            if all(color_map[u] != color_map[v] for u, v in G.edges):
                return k
    return n  # worst-case

def analyze_tightness_reason():
    import networkx as nx
    import json

    G = nx.Graph()
    for i, (x, y) in enumerate(vertices):
        G.add_node(i)
    for i, j in edges:
        G.add_edge(i, j)

    if G.number_of_nodes() < 2:
        return json.dumps({
            "tight": False,
            "reason": "too_small",
            "highlight": [],
            "message": "Graph too small to analyze tightness."
        })

    if not nx.is_connected(G):
        return json.dumps({
            "tight": False,
            "reason": "disconnected",
            "highlight": [],
            "message": "Graph is not connected. Must be a connected graph to explain tightness."
        })

    print(f"{coloring.values()}")
    chromatic_number = max(coloring.values()) + 1 if coloring else 0
    degrees = dict(G.degree())
    max_degree = max(degrees.values())
    max_degree_vertices = [str(v) for v, deg in degrees.items() if deg == max_degree]
    n = G.number_of_nodes()

    if len(max_degree_vertices) == 1:
        max_degree_detail = f"(at vertex {max_degree_vertices[0]})"
    elif len(max_degree_vertices) == 2:
        max_degree_detail = f"(at vertices {max_degree_vertices[0]} and {max_degree_vertices[1]})"
    elif len(max_degree_vertices) == 3:
        max_degree_detail = f"(at vertices {max_degree_vertices[0]}, {max_degree_vertices[1]}, and {max_degree_vertices[2]})"
    elif len(max_degree_vertices) == 4:
        max_degree_detail = f"(at vertices {max_degree_vertices[0]}, {max_degree_vertices[1]}, {max_degree_vertices[2]}, and {max_degree_vertices[3]})"
    else:
        max_degree_detail = "(at several vertices)"

    if chromatic_number != max_degree + 1:
        return json.dumps({
            "tight": False,
            "reason": "not_tight",
            "highlight": [],
            "message": f"""χ(G) = {chromatic_number}, Δ(G) = {max_degree} {max_degree_detail}.
Not tight because fewer than Δ(G)+1 colors were sufficient."""
        })

    # Check if graph is an odd cycle
    is_odd_cycle = (
        nx.is_connected(G)
        and len(G.nodes) == len(G.edges)
        and all(deg == 2 for _, deg in G.degree())
        and len(G.nodes) % 2 == 1
    )

    if is_odd_cycle:
        return json.dumps({
            "tight": True,
            "reason": "odd_cycle",
            "highlight": list(G.nodes()),
            "message": f"""χ(G) = {chromatic_number}, Δ(G) = {max_degree} {max_degree_detail}.
The graph is an odd cycle C{n}, which forces χ(G) = Δ(G) + 1."""
        })

    # Check if the graph is a complete graph
    is_complete = (
        nx.is_connected(G)
        and n >= 2
        and G.number_of_edges() == n * (n - 1) // 2
    )

    if is_complete:
        return json.dumps({
            "tight": True,
            "reason": "complete_graph",
            "highlight": list(G.nodes()),
            "message": f"""χ(G) = {chromatic_number}, Δ(G) = {max_degree} {max_degree_detail}.
The graph is a complete graph K{n}, which forces χ(G) = Δ(G) + 1."""
        })

    # If it's tight but no known structure was matched, use an exact algorithm to confirm χ(G)
    true_chi = exact_chromatic_number(G)

    if true_chi != chromatic_number:
        return json.dumps({
            "tight": False,
            "reason": "greedy_overestimate",
            "highlight": [],
            "message": f"""χ(G) = {chromatic_number}, Δ(G) = {max_degree} {max_degree_detail}.
Greedy coloring used {chromatic_number} colors, but the true chromatic number is {true_chi}. Not a tight bound."""
        })

    return json.dumps({
        "tight": True,
        "reason": "confirmed_by_exact_solver",
        "highlight": [],
        "message": f"""χ(G) = {chromatic_number}, Δ(G) = {max_degree} {max_degree_detail}.
Tight bound confirmed by exact coloring. Reason unknown."""
    })



print("Python environment loaded.")
        `);
        pyodideReady = true;
        document.getElementById("loadingOverlay").style.display = "none";
    }

    async function recolorWithStrategy(strategy) {
        if (!pyodideReady) return;
        await syncGraphToPython();
        const result = await pyodide.runPythonAsync(`compute_coloring_info('${strategy}')`);
        const parsed = JSON.parse(result);

        vertexColors = parsed.coloring || {};
        previousColors = { ...vertexColors };
        document.getElementById("output").innerText = parsed.message;
        drawGraph();
    }

    // Run code in python
    async function runPython(command, arg = undefined) {
        if (!pyodideReady) return alert("Python is still loading...");
        let commandStr = arg !== undefined ? `${command}('${arg}')` : `${command}()`;
        try {
            let result = await pyodide.runPythonAsync(commandStr);

            document.getElementById("output").innerText = result || "Command executed.";

            if (command === "compute_tight_coloring") {
                const parsed = JSON.parse(result);

                vertexColors = parsed.coloring || {};
                previousColors = { ...vertexColors };

                document.getElementById("output").innerText = parsed.message;
                drawGraph();
                return;
            }


            if (command === "clear_graph") {
                saveUndoState();
                vertices = [];
                edges = [];
                selectedVertex = null;
                drawGraph();
            }
        } catch (err) {
            document.getElementById("output").innerText = "Error: " + err;
        }
    }

    async function syncGraphToPython() {
        if (!pyodideReady) return;
        await pyodide.runPythonAsync(`sync_graph_to_python(${JSON.stringify(vertices)}, ${JSON.stringify(edges)})`);
    }

    async function explainTightBound() {
        if (!pyodideReady) return;

        await syncGraphToPython();
        const result = await pyodide.runPythonAsync("analyze_tightness_reason()");
        const parsed = JSON.parse(result);

        document.getElementById("output").innerText = parsed.message;

        if (parsed.highlight.length > 0) {
            highlightVertices(parsed.highlight);
        }
    }

    function highlightVertices(nodeIndices) {
        let ctx = canvas.getContext("2d");
        drawGraph(); // first draw normally
        ctx.strokeStyle = "orange";
        ctx.lineWidth = 4;
        for (let i of nodeIndices) {
            let [x, y] = vertices[i];
            ctx.beginPath();
            ctx.arc(x, y, 14, 0, 2 * Math.PI);
            ctx.stroke();
        }
    }

    let brooksPages = [
        `Brook's Theorem

In any connected undirected graph G, the chromatic number χ(G) is at most the maximum degree Δ(G) + 1, except in two special cases:

  - G is a complete graph (every vertex connected to every other), or
  - G is an odd cycle (a cycle with an odd number of vertices).

In those cases, Brooke proposes a stronger theorem: the chromatic number is exactly equal to the maximum degree Δ(G) + 1,
`,
        `Proof: χ(G) ≤ Δ(G) + 1:

Let G be a connected undirected graph. Let 𝑣 be a vertex of max degree in G. The worst possible coloring when starting at 𝑣 would be to color 𝑣 and all its adjacent vertices with different colors, which uses a total of Δ(G) + 1 colors.

Now consider any other vertex in the graph G. We can color the rest of the graph using just the Δ(G) + 1 colors that we've already used to color 𝑣 and its adjacent vertices.

We know this because at any other vertex 𝑢 ≠ 𝑣, the degree of 𝑢 is at most Δ(G) (it cannot be larger, and for many vertices, it is strictly less).

Therefore, when coloring 𝑢:
  - It has at most Δ(G) neighbors.
  - So, at worst, all Δ(G) colors might already be used among its neighbors.
  - Thus, we may need the (Δ(G) + 1)-th color to ensure a proper coloring.
`,
        `Why are complete graphs and odd cycles special?:

- In a complete graph Kₙ, every vertex touches every other.
  So you need n different colors (one for each vertex).

- In an odd cycle Cₙ (n odd), it's impossible to alternate two colors.
  You are forced to use three colors instead of two.
`,
        `Proof: χ(G) = Δ(G) + 1 (for complete and odd-cycle graphs):

Let G be a complete graph Kx. The max degree of a Kx graph is always x - 1. For any vertex 𝑣 in G, suppose we were to start the graph coloring by using less than Δ(G) + 1 colors to color 𝑣 and its adjacent vertices.

Since G is a complete graph, our graph coloring would be finished simply by coloring 𝑣 and its adjacent vertices. However, if we were to use less than Δ(G) + 1 colors, that would mean at least two vertices would be forced to share the same color. These two vertices would inevitably be adjacent due to the fact that our graph is complete. Therefore, we cannot use less than Δ(G) + 1 colors.

Now let H be an odd cycle. The max degree of a cycle graph is always 2. For any vertex 𝑣 in H, suppose were to attempt to color H using only Δ(H) = 2 colors (say, color A and color B).

We can begin by coloring 𝑣 with color A, and then alternately color its neighbors along the cycle (B, A, B, A, etc). However, since the cycle has an odd number of vertices, when we return to the starting vertex 𝑣, the alternating pattern forces a conflict where the last neighbor of 𝑣 will be colored with the same color as 𝑣 itself. Therefore, we cannot use less than Δ(G) + 1 colors.
`,
        `Summary:

For all connected undirected graphs,
χ(G) ≤ Δ(G) + 1.

For complete graphs and odd cycles,
χ(G) = Δ(G) + 1.
`];

    function explainBrooksTheorem() {
        currentPage = 0; // Start at the first page
        showCurrentPage();
        document.getElementById('modalOverlay').style.display = 'block'; // Show dim background
        document.getElementById('brooksModal').style.display = 'block';  // Show modal
    }

    function showCurrentPage() {
        const totalPages = brooksPages.length;
        const current = currentPage + 1;
        document.getElementById('brooksModalHeader').innerText = `Brook's Theorem (Page ${current}/${totalPages})`;
        document.getElementById('brooksModalContent').innerText = brooksPages[currentPage];
    }

    function nextPage() {
        if (currentPage < brooksPages.length - 1) {
            currentPage++;
            showCurrentPage();
        }
    }

    function prevPage() {
        if (currentPage > 0) {
            currentPage--;
            showCurrentPage();
        }
    }

    function closeBrooksModal() {
        document.getElementById('brooksModal').style.display = 'none';
        document.getElementById('modalOverlay').style.display = 'none';  // Hide dim background
    }

    async function updateColoringInfo() {
        if (!pyodideReady) return;
        await syncGraphToPython();
        const result = await pyodide.runPythonAsync("compute_coloring_info()");
        const parsed = JSON.parse(result);
        const newColors = parsed.coloring || {};

        for (let v in newColors) {
            if (vertexColors[v] !== newColors[v]) {
                vertexColors[v] = newColors[v];
            }
        }

        previousColors = { ...vertexColors };

        document.getElementById("output").innerText = parsed.message;
        drawGraph();
    }

    // Function for dragging vertices in the main canvas
    function dragVertex(event) {
        let rect = canvas.getBoundingClientRect();
        let x = event.clientX - rect.left;
        let y = event.clientY - rect.top;

        if (draggingVertex !== null) {
            vertices[draggingVertex] = [x, y];
            hasMoved = true;
            drawGraph();
        }
    }

    function handleMouseUp(event) {
        canvas.removeEventListener("mousemove", dragVertex);

        if (!hasMoved) {
            let rect = canvas.getBoundingClientRect();
            let x = event.clientX - rect.left;
            let y = event.clientY - rect.top;
            let nearest = findNearestVertex(x, y);

            if (nearest !== null) {
                if (nearest === selectedVertex) {
                    // If clicking the already selected vertex, unselect it
                    selectedVertex = null;
                } else if (selectedVertex === null) {
                    // If no vertex was selected, select this one
                    selectedVertex = nearest;
                } else {
                    // If selecting a different vertex, check for an existing edge
                    let edgeIndex = edges.findIndex(([a, b]) =>
                        (a === selectedVertex && b === nearest) || (b === selectedVertex && a === nearest)
                    );

                    if (edgeIndex !== -1) {
                        edges.splice(edgeIndex, 1);  // Remove edge if it exists
                    } else {
                        edges.push([selectedVertex, nearest]); // Create edge if it doesn't exist
                    }

                    selectedVertex = nearest;
                    updateColoringInfo();
                }
            }
        }
        else {

        }
        draggingVertex = null;
        drawGraph();
    }

    function undoAction() {
        if (undoStack.length === 0) return;

        // Save current state to redo stack
        redoStack.push({
            vertices: JSON.parse(JSON.stringify(vertices)),
            edges: JSON.parse(JSON.stringify(edges)),
            selectedVertex: selectedVertex
        });

        // Restore last undo state
        const lastState = undoStack.pop();
        vertices = lastState.vertices;
        edges = lastState.edges;
        selectedVertex = lastState.selectedVertex;
        drawGraph();
        syncGraphToPython();
        updateColoringInfo();
    }

    function redoAction() {
        if (redoStack.length === 0) return;

        // Save current state to undo stack
        undoStack.push({
            vertices: JSON.parse(JSON.stringify(vertices)),
            edges: JSON.parse(JSON.stringify(edges)),
            selectedVertex: selectedVertex
        });

        // Restore last redo state
        const lastState = redoStack.pop();
        vertices = lastState.vertices;
        edges = lastState.edges;
        selectedVertex = lastState.selectedVertex;
        drawGraph();
        syncGraphToPython();
        updateColoringInfo();
    }

    function deleteVertex() {
        if (selectedVertex === null) {
            alert("No vertex selected for deletion.");
            return;
        }

        saveUndoState();

        // Remove all edges associated with the selected vertex
        edges = edges.filter(([a, b]) => a !== selectedVertex && b !== selectedVertex);

        // Remove the selected vertex from the list
        vertices.splice(selectedVertex, 1);

        // Update all edges to reflect the removed vertex label
        edges = edges.map(([a, b]) => [
            a > selectedVertex ? a - 1 : a,
            b > selectedVertex ? b - 1 : b
        ]);

        // Reset the selected vertex after deletion
        selectedVertex = null;

        // Redraw the graph after deletion
        drawGraph();
        syncGraphToPython();
        updateColoringInfo();
    }

    // Used to find the nearest vertex in the main canvas relative to the mouse
    function findNearestVertex(x, y) {
        for (let i = 0; i < vertices.length; i++) {
            let [vx, vy] = vertices[i];
            if (Math.sqrt((vx - x) ** 2 + (vy - y) ** 2) < 10) {
                return i;
            }
        }
        return null;
    }

    function saveUndoState() {
        // Only push if state actually changed
        undoStack.push({
            vertices: JSON.parse(JSON.stringify(vertices)),
            edges: JSON.parse(JSON.stringify(edges)),
            selectedVertex: selectedVertex
        });

        if (undoStack.length > MAX_UNDO) {
            undoStack.shift();
        }

        // Clear redo stack on new action
        redoStack = [];
    }

    // Handles drawing the main canvas
    function drawGraph() {
        let ctx = canvas.getContext("2d");
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        let highlightedEdges = new Set();

        // Highlight edges connected to hoveredVertex
        if (hoveredVertex !== null) {
            highlightedEdges.clear(); // Clear previous highlights
            let mappedVertex = null;

            if (isomorphismMapping) {
                // Check forward mapping (G1 -> G2)
                if (isomorphismMapping[hoveredVertex] !== undefined) {
                    mappedVertex = isomorphismMapping[hoveredVertex];
                } else {
                    // Check reverse mapping (G2 -> G1)
                    for (const [key, value] of Object.entries(isomorphismMapping)) {
                        if (parseInt(value) === hoveredVertex) {
                            mappedVertex = parseInt(key);
                            break;
                        }
                    }
                }
            }

            // Highlight edges connected to the hovered vertex
            edges.forEach(([i, j]) => {
                if (i === hoveredVertex || j === hoveredVertex) {
                    highlightedEdges.add(`${i}-${j}`);
                    highlightedEdges.add(`${j}-${i}`);
                }
            });

            // Highlight edges connected to the mapped vertex (if any)
            if (mappedVertex !== null) {
                edges.forEach(([i, j]) => {
                    if (i === mappedVertex || j === mappedVertex) {
                        highlightedEdges.add(`${i}-${j}`);
                        highlightedEdges.add(`${j}-${i}`);
                    }
                });
            }
        }

        // Draw edges
        edges.forEach(([i, j]) => {
            const edgeKey1 = `${i}-${j}`;
            const edgeKey2 = `${j}-${i}`;
            const isHighlighted = highlightedEdges.has(edgeKey1) || highlightedEdges.has(edgeKey2);

            ctx.strokeStyle = isHighlighted ? "lightblue" : "black";
            ctx.lineWidth = isHighlighted ? 4 : 2;
            let [x1, y1] = vertices[i];
            let [x2, y2] = vertices[j];
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();
        });

        vertices.forEach(([x, y], i) => {
            const colorIndex = vertexColors[i] ?? -1;
            const fillColor = colorIndex >= 0 ? colorPalette[colorIndex % colorPalette.length] : "black";

            // Draw the colored vertex
            ctx.beginPath();
            ctx.arc(x, y, 8, 0, 2 * Math.PI);
            ctx.fillStyle = fillColor;
            ctx.fill();

            // If selected, draw a hollow circle around it
            if (i === selectedVertex) {
                ctx.beginPath();
                ctx.arc(x, y, 12, 0, 2 * Math.PI);
                ctx.lineWidth = 2;
                ctx.strokeStyle = "black";
                ctx.stroke();
            }

            // Draw vertex index number
            ctx.fillStyle = "black";
            ctx.font = "15px Arial";
            ctx.fillText(i, x + 10, y + 5);
        });
    }

    // ------------------ Main Canvas Events ------------------ \\

    canvas.addEventListener("mousedown", function (event) {
        saveUndoState();
        let rect = canvas.getBoundingClientRect();
        let x = event.clientX - rect.left;
        let y = event.clientY - rect.top;

        let nearest = findNearestVertex(x, y);
        hasMoved = false;

        if (nearest !== null) {
            draggingVertex = nearest;
            startX = vertices[nearest][0];
            startY = vertices[nearest][1];

            canvas.addEventListener("mousemove", dragVertex);
            canvas.addEventListener("mouseup", handleMouseUp);
        } else {
            vertices.push([x, y]);
            selectedVertex = vertices.length - 1;
            syncGraphToPython();
            drawGraph();
            updateColoringInfo();

            // STOP handleMouseUp() from running after creating a vertex
            canvas.removeEventListener("mouseup", handleMouseUp);
        }
    });

</script>
</body>
</html>
